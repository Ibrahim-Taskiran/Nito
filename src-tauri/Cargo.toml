[package]
name = "nito"
version = "0.1.0"
description = "Nito"
edition = "2021"

[lib]
name = "nito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Ollama on localhost only: no TLS, so no extra (non-allowed) root-cert crates.
tauri-plugin-http = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
panic = "abort"
